# Nginx Configuration for Next.js Reverse Proxy
# Copy this to /etc/nginx/sites-available/college and symlink to sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment after SSL is configured)
    # return 301 https://$host$request_uri;
}

